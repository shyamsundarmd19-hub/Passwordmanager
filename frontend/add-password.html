<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Add Password - VaultGuard Enterprise</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/vault.css">
</head>
<body>
  <div class="app-container">
    <!-- Sidebar -->
    <aside class="sidebar">
      <div class="brand-header">
        <div class="brand-icon">
          <i class="fa-solid fa-shield-halved"></i>
        </div>
        <div>
          <div class="brand-title">VaultGuard</div>
          <span class="brand-badge">ENTERPRISE</span>
        </div>
      </div>

      <nav class="sidebar-nav">
        <div class="nav-section-label">Main Console</div>
        <a href="dashboard.html" class="nav-item">
          <i class="fa-solid fa-chart-pie"></i>
          <span>Dashboard</span>
        </a>
        <a href="vault.html" class="nav-item">
          <i class="fa-solid fa-vault"></i>
          <span>Password Vault</span>
        </a>
        <a href="vault.html?favorite=true" class="nav-item">
          <i class="fa-solid fa-star"></i>
          <span>Favorites</span>
        </a>
        <a href="folders.html" class="nav-item">
          <i class="fa-solid fa-folder-tree"></i>
          <span>Folders</span>
        </a>

        <div class="nav-section-label">Security Tools</div>
        <a href="add-password.html" class="nav-item active">
          <i class="fa-solid fa-key"></i>
          <span>Add Credential</span>
        </a>
        <a href="security.html" class="nav-item">
          <i class="fa-solid fa-shield-virus"></i>
          <span>Security Center</span>
        </a>
        <a href="activity.html" class="nav-item">
          <i class="fa-solid fa-list-check"></i>
          <span>Activity Log</span>
        </a>

        <div class="nav-section-label">System Account</div>
        <a href="profile.html" class="nav-item">
          <i class="fa-regular fa-id-badge"></i>
          <span>My Profile</span>
        </a>
        <a href="settings.html" class="nav-item">
          <i class="fa-solid fa-sliders"></i>
          <span>Settings</span>
        </a>
      </nav>

      <div class="sidebar-footer">
        <button class="btn-logout-sidebar" onclick="logoutUser()">
          <i class="fa-solid fa-right-from-bracket"></i> Logout Securely
        </button>
      </div>
    </aside>

    <!-- Main Content Area -->
    <main class="main-wrapper">
      <!-- Topbar -->
      <header class="topbar">
        <div class="page-header-title">
          <i class="fa-solid fa-plus" style="color:var(--accent-blue);"></i> Store New Credential
        </div>
        <div class="topbar-actions">
          <a href="vault.html" class="btn-secondary" style="font-size:0.85rem; padding:8px 16px;">
            <i class="fa-solid fa-arrow-left"></i> Back to Vault
          </a>
        </div>
      </header>

      <!-- Content Area -->
      <div class="content-area">
        <div style="max-width:720px; margin:0 auto;">
          <div class="vg-card">
            <div class="card-header-flex">
              <div class="card-title-text">
                <i class="fa-solid fa-lock" style="color:var(--accent-blue);"></i> Credential Details
              </div>
              <span style="font-size:0.8rem; color:var(--text-muted);">Encrypted with AES-256-GCM</span>
            </div>

            <form id="add-password-form">
              <div style="display:grid; grid-template-columns: 1fr 1fr; gap:20px;">
                <div class="form-group">
                  <label class="form-label" for="add-service">Service Name *</label>
                  <input type="text" id="add-service" class="form-control" placeholder="e.g. AWS Console, GitHub, Slack" required>
                </div>

                <div class="form-group">
                  <label class="form-label" for="add-username">Username / Email *</label>
                  <input type="text" id="add-username" class="form-control" placeholder="e.g. developer@company.com" required>
                </div>
              </div>

              <div class="form-group">
                <div style="display:flex; align-items:center; justify-content:space-between; margin-bottom:8px;">
                  <label class="form-label" for="add-password" style="margin-bottom:0;">Password *</label>
                  <button type="button" class="btn-secondary" style="font-size:0.75rem; padding:4px 10px;" onclick="generateAndSetPassword()">
                    <i class="fa-solid fa-wand-magic-sparkles" style="color:var(--accent-cyan);"></i> Generate Strong Password
                  </button>
                </div>
                <div class="password-input-wrapper">
                  <input type="password" id="add-password" class="form-control" placeholder="Enter password or click generate" required>
                  <button type="button" class="toggle-password-btn" onclick="togglePasswordVisibility('add-password', this)">
                    <i class="fa-regular fa-eye"></i>
                  </button>
                </div>
                <div class="strength-bar-wrapper">
                  <div class="strength-bar-bg">
                    <div id="add-strength-bar" class="strength-bar-fill"></div>
                  </div>
                  <div id="add-strength-label" class="strength-text">Password Strength: None</div>
                </div>
              </div>

              <div style="display:grid; grid-template-columns: 1fr 1fr; gap:20px;">
                <div class="form-group">
                  <label class="form-label" for="add-category">Category</label>
                  <select id="add-category" class="form-select">
                    <option value="Work">Work</option>
                    <option value="Development">Development</option>
                    <option value="Cloud">Cloud Services</option>
                    <option value="Social">Social Media</option>
                    <option value="Finance">Finance</option>
                    <option value="Personal">Personal</option>
                  </select>
                </div>

                <div class="form-group">
                  <label class="form-label" for="password-folder-select">Assign to Folder</label>
                  <select id="password-folder-select" class="form-select">
                    <option value="">(None - Unorganized)</option>
                  </select>
                </div>
              </div>

              <div class="form-group">
                <label class="form-label" for="add-url">Website / Portal URL</label>
                <input type="url" id="add-url" class="form-control" placeholder="https://aws.amazon.com/console">
              </div>

              <div class="form-group">
                <label class="form-label" for="add-notes">Encrypted Notes & Secret Hints</label>
                <textarea id="add-notes" class="form-control" rows="3" placeholder="Additional notes, recovery codes, or API secret keys..."></textarea>
              </div>

              <div class="form-group" style="margin-bottom:28px;">
                <label class="checkbox-label">
                  <input type="checkbox" id="add-favorite"> Mark as Favorite Credential
                </label>
              </div>

              <div style="display:flex; gap:16px; justify-content:flex-end;">
                <a href="vault.html" class="btn-secondary">Cancel</a>
                <button type="submit" class="btn-primary">
                  <i class="fa-solid fa-lock"></i> Encrypt & Save to Vault
                </button>
              </div>
            </form>
          </div>
        </div>
      </div>
    </main>
  </div>

  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/password-generator.js"></script>
  <script src="js/folders.js"></script>
  <script>
    function togglePasswordVisibility(inputId, btn) {
      const input = document.getElementById(inputId);
      const icon = btn.querySelector('i');
      if (input.type === 'password') {
        input.type = 'text';
        icon.className = 'fa-regular fa-eye-slash';
      } else {
        input.type = 'password';
        icon.className = 'fa-regular fa-eye';
      }
    }

    function generateAndSetPassword() {
      const pwdInput = document.getElementById('add-password');
      const generated = generateClientPassword({ length: 18, uppercase: true, lowercase: true, numbers: true, symbols: true });
      pwdInput.value = generated;
      pwdInput.type = 'text';
      pwdInput.dispatchEvent(new Event('input'));
      showToast('Generated 18-character high-entropy password.', 'success');
    }

    const pwdInput = document.getElementById('add-password');
    const barFill = document.getElementById('add-strength-bar');
    const labelElem = document.getElementById('add-strength-label');

    pwdInput.addEventListener('input', () => {
      const pwd = pwdInput.value;
      const res = evaluateStrength(pwd);

      barFill.style.width = `${res.score}%`;
      labelElem.textContent = `Password Strength: ${res.label}`;

      if (res.score >= 80) barFill.style.backgroundColor = 'var(--accent-green)';
      else if (res.score >= 60) barFill.style.backgroundColor = 'var(--accent-blue)';
      else if (res.score >= 40) barFill.style.backgroundColor = 'var(--accent-yellow)';
      else barFill.style.backgroundColor = 'var(--accent-red)';
    });

    document.getElementById('add-password-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const service_name = document.getElementById('add-service').value;
      const username = document.getElementById('add-username').value;
      const password = document.getElementById('add-password').value;
      const category = document.getElementById('add-category').value;
      const folder_id = document.getElementById('password-folder-select').value;
      const website_url = document.getElementById('add-url').value;
      const notes = document.getElementById('add-notes').value;
      const favorite = document.getElementById('add-favorite').checked;

      try {
        await apiRequest('/passwords', {
          method: 'POST',
          body: JSON.stringify({
            service_name,
            username,
            password,
            category,
            folder_id,
            website_url,
            notes,
            favorite
          })
        });

        showToast('Credential successfully encrypted and stored!', 'success');
        setTimeout(() => {
          window.location.href = 'vault.html';
        }, 600);
      } catch (err) {
        showToast(err.message || 'Failed to save credential.', 'error');
      }
    });
  </script>
</body>
</html>
