<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Edit Password - VaultGuard Enterprise</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/vault.css">
</head>
<body>
  <div class="app-container">
    <!-- Sidebar -->
    <aside class="sidebar">
      <div class="brand-header">
        <div class="brand-icon">
          <i class="fa-solid fa-shield-halved"></i>
        </div>
        <div>
          <div class="brand-title">VaultGuard</div>
          <span class="brand-badge">ENTERPRISE</span>
        </div>
      </div>

      <nav class="sidebar-nav">
        <div class="nav-section-label">Main Console</div>
        <a href="dashboard.html" class="nav-item">
          <i class="fa-solid fa-chart-pie"></i>
          <span>Dashboard</span>
        </a>
        <a href="vault.html" class="nav-item active">
          <i class="fa-solid fa-vault"></i>
          <span>Password Vault</span>
        </a>
        <a href="vault.html?favorite=true" class="nav-item">
          <i class="fa-solid fa-star"></i>
          <span>Favorites</span>
        </a>
        <a href="folders.html" class="nav-item">
          <i class="fa-solid fa-folder-tree"></i>
          <span>Folders</span>
        </a>

        <div class="nav-section-label">Security Tools</div>
        <a href="add-password.html" class="nav-item">
          <i class="fa-solid fa-key"></i>
          <span>Add Credential</span>
        </a>
        <a href="security.html" class="nav-item">
          <i class="fa-solid fa-shield-virus"></i>
          <span>Security Center</span>
        </a>
        <a href="activity.html" class="nav-item">
          <i class="fa-solid fa-list-check"></i>
          <span>Activity Log</span>
        </a>

        <div class="nav-section-label">System Account</div>
        <a href="profile.html" class="nav-item">
          <i class="fa-regular fa-id-badge"></i>
          <span>My Profile</span>
        </a>
        <a href="settings.html" class="nav-item">
          <i class="fa-solid fa-sliders"></i>
          <span>Settings</span>
        </a>
      </nav>

      <div class="sidebar-footer">
        <button class="btn-logout-sidebar" onclick="logoutUser()">
          <i class="fa-solid fa-right-from-bracket"></i> Logout Securely
        </button>
      </div>
    </aside>

    <!-- Main Content Area -->
    <main class="main-wrapper">
      <!-- Topbar -->
      <header class="topbar">
        <div class="page-header-title">
          <i class="fa-solid fa-pen-to-square" style="color:var(--accent-blue);"></i> Edit Stored Credential
        </div>
        <div class="topbar-actions">
          <a href="vault.html" class="btn-secondary" style="font-size:0.85rem; padding:8px 16px;">
            <i class="fa-solid fa-arrow-left"></i> Back to Vault
          </a>
        </div>
      </header>

      <!-- Content Area -->
      <div class="content-area">
        <div style="max-width:720px; margin:0 auto;">
          <div class="vg-card">
            <div class="card-header-flex">
              <div class="card-title-text">
                <i class="fa-solid fa-pen-to-square" style="color:var(--accent-blue);"></i> Update Credential Properties
              </div>
            </div>

            <form id="edit-password-form">
              <input type="hidden" id="edit-id">

              <div style="display:grid; grid-template-columns: 1fr 1fr; gap:20px;">
                <div class="form-group">
                  <label class="form-label" for="edit-service">Service Name *</label>
                  <input type="text" id="edit-service" class="form-control" required>
                </div>

                <div class="form-group">
                  <label class="form-label" for="edit-username">Username / Email *</label>
                  <input type="text" id="edit-username" class="form-control" required>
                </div>
              </div>

              <div class="form-group">
                <div style="display:flex; align-items:center; justify-content:space-between; margin-bottom:8px;">
                  <label class="form-label" for="edit-password" style="margin-bottom:0;">New Password (Leave blank to keep current)</label>
                  <button type="button" class="btn-secondary" style="font-size:0.75rem; padding:4px 10px;" onclick="generateAndSetEditPassword()">
                    <i class="fa-solid fa-wand-magic-sparkles" style="color:var(--accent-cyan);"></i> Generate Password
                  </button>
                </div>
                <div class="password-input-wrapper">
                  <input type="password" id="edit-password" class="form-control" placeholder="•••••••••••• (Unchanged)">
                  <button type="button" class="toggle-password-btn" onclick="togglePasswordVisibility('edit-password', this)">
                    <i class="fa-regular fa-eye"></i>
                  </button>
                </div>
              </div>

              <div style="display:grid; grid-template-columns: 1fr 1fr; gap:20px;">
                <div class="form-group">
                  <label class="form-label" for="edit-category">Category</label>
                  <select id="edit-category" class="form-select">
                    <option value="Work">Work</option>
                    <option value="Development">Development</option>
                    <option value="Cloud">Cloud Services</option>
                    <option value="Social">Social Media</option>
                    <option value="Finance">Finance</option>
                    <option value="Personal">Personal</option>
                  </select>
                </div>

                <div class="form-group">
                  <label class="form-label" for="password-folder-select">Assign to Folder</label>
                  <select id="password-folder-select" class="form-select">
                    <option value="">(None - Unorganized)</option>
                  </select>
                </div>
              </div>

              <div class="form-group">
                <label class="form-label" for="edit-url">Website / Portal URL</label>
                <input type="url" id="edit-url" class="form-control">
              </div>

              <div class="form-group">
                <label class="form-label" for="edit-notes">Encrypted Notes</label>
                <textarea id="edit-notes" class="form-control" rows="3"></textarea>
              </div>

              <div class="form-group" style="margin-bottom:28px;">
                <label class="checkbox-label">
                  <input type="checkbox" id="edit-favorite"> Mark as Favorite Credential
                </label>
              </div>

              <div style="display:flex; gap:16px; justify-content:flex-end;">
                <a href="vault.html" class="btn-secondary">Cancel</a>
                <button type="submit" class="btn-primary">
                  <i class="fa-solid fa-floppy-disk"></i> Save Changes
                </button>
              </div>
            </form>
          </div>
        </div>
      </div>
    </main>
  </div>

  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/password-generator.js"></script>
  <script src="js/folders.js"></script>
  <script>
    function togglePasswordVisibility(inputId, btn) {
      const input = document.getElementById(inputId);
      const icon = btn.querySelector('i');
      if (input.type === 'password') {
        input.type = 'text';
        icon.className = 'fa-regular fa-eye-slash';
      } else {
        input.type = 'password';
        icon.className = 'fa-regular fa-eye';
      }
    }

    function generateAndSetEditPassword() {
      const pwdInput = document.getElementById('edit-password');
      const generated = generateClientPassword({ length: 18, uppercase: true, lowercase: true, numbers: true, symbols: true });
      pwdInput.value = generated;
      pwdInput.type = 'text';
      showToast('Generated 18-character high-entropy password.', 'success');
    }

    async function loadCredentialForEdit() {
      const params = new URLSearchParams(window.location.search);
      const id = params.get('id');
      if (!id) {
        window.location.href = 'vault.html';
        return;
      }

      try {
        const data = await apiRequest(`/passwords/${id}`);
        const p = data.password;

        document.getElementById('edit-id').value = p.id;
        document.getElementById('edit-service').value = p.service_name || '';
        document.getElementById('edit-username').value = p.username || '';
        document.getElementById('edit-category').value = p.category || 'Work';
        document.getElementById('edit-url').value = p.website_url || '';
        document.getElementById('edit-notes').value = p.notes || '';
        document.getElementById('edit-favorite').checked = Boolean(p.favorite);

        if (p.folder_id) {
          const folderSelect = document.getElementById('password-folder-select');
          if (folderSelect) folderSelect.value = p.folder_id;
        }
      } catch (err) {
        showToast(err.message || 'Failed to load credential details.', 'error');
      }
    }

    document.addEventListener('DOMContentLoaded', () => {
      loadCredentialForEdit();

      document.getElementById('edit-password-form').addEventListener('submit', async (e) => {
        e.preventDefault();
        const id = document.getElementById('edit-id').value;
        const service_name = document.getElementById('edit-service').value;
        const username = document.getElementById('edit-username').value;
        const password = document.getElementById('edit-password').value;
        const category = document.getElementById('edit-category').value;
        const folder_id = document.getElementById('password-folder-select').value;
        const website_url = document.getElementById('edit-url').value;
        const notes = document.getElementById('edit-notes').value;
        const favorite = document.getElementById('edit-favorite').checked;

        try {
          await apiRequest(`/passwords/${id}`, {
            method: 'PUT',
            body: JSON.stringify({
              service_name,
              username,
              password,
              category,
              folder_id,
              website_url,
              notes,
              favorite
            })
          });

          showToast('Credential updated successfully!', 'success');
          setTimeout(() => {
            window.location.href = 'vault.html';
          }, 600);
        } catch (err) {
          showToast(err.message || 'Failed to update credential.', 'error');
        }
      });
    });
  </script>
</body>
</html>
